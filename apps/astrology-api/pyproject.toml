[project]
name="jeevan-astrology-api"
version="0.2.0"
requires-python=">=3.12"
dependencies=["fastapi==0.141.1","uvicorn[standard]>=0.35,<0.36","pydantic>=2.11,<3","pydantic-settings>=2.10,<3","pyswisseph>=2.10.3.2","python-dateutil>=2.9,<3","timezonefinder>=6.6,<7","tzdata>=2025.2"]
[project.optional-dependencies]
dev=["pytest>=8.4,<9","httpx>=0.28,<0.29","ruff>=0.12,<0.13"]
[tool.pytest.ini_options]
pythonpath=["."]
[tool.ruff]
line-length=100
target-version="py312"

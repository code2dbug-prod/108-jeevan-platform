services:
  astrology-api:
    build:
      context: ./apps/astrology-api
    ports: ["8000:8000"]
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
    volumes: ["./apps/astrology-api:/app"]
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @jeevan/web dev"
    ports: ["3000:3000"]
    environment:
      ASTROLOGY_API_URL: http://astrology-api:8000
    volumes: [".:/workspace"]
    depends_on: [astrology-api]
